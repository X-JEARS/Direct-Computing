[package]
name = "direct-computing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Requires a native libx264 development installation discoverable through
# pkg-config. It is opt-in because x264's GPL/commercial licensing and native
# deployment requirements differ from the default Apache-2.0 build.
x264 = ["dc-platform/x264"]

[dependencies]
dc-common = { path = "../../crates/dc-common" }
dc-auth = { path = "../../crates/dc-auth" }
dc-desktop = { path = "../../crates/dc-desktop" }
dc-media = { path = "../../crates/dc-media" }
dc-protocol = { path = "../../crates/dc-protocol" }
dc-session = { path = "../../crates/dc-session" }
dc-transport = { path = "../../crates/dc-transport" }
dc-ui = { path = "../../crates/dc-ui" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
dc-platform = { path = "../../crates/dc-platform" }

[target.'cfg(target_os = "macos")'.dependencies]
dc-platform = { path = "../../crates/dc-platform" }

[lints]
workspace = true
