[package]
name = "dc-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Platform adapters for Direct Computing"

[dependencies]
dc-common = { path = "../dc-common" }
dc-media = { path = "../dc-media", default-features = false }
dc-protocol = { path = "../dc-protocol" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# VideoToolbox/CoreMedia/CoreVideo are linked directly from the macOS SDK; no
# third-party runtime dependency is required for the Viewer decoder.

# FFI is isolated in this crate; all other workspace crates continue to forbid unsafe code.
[lints.rust]
unsafe_code = "allow"
